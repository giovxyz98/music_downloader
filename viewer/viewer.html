<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src file:; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Log Viewer</title>
<style>
  :root { --bg:#fff; --text:#222; --dim:#8a8f98; --warn:#a66a00; --bad:#c62828; --link:#1a56b0; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1b1b1d; --text:#d6d6d6; --dim:#85898f; --warn:#d4a24c; --bad:#e57373; --link:#8ab4f8; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.5 Consolas, "Cascadia Mono", monospace; }
  header { position: sticky; top: 0; background: var(--bg); padding: 10px 16px 8px; border-bottom: 1px solid var(--dim); }
  .src { color: var(--dim); font-size: 12px; word-break: break-all; }
  .bar { display: flex; flex-wrap: wrap; gap: 14px; align-items: baseline; margin-top: 6px; }
  input[type=search] { flex: 1 1 200px; background: transparent; color: var(--text); border: 0;
    border-bottom: 1px solid var(--dim); padding: 2px 0; font: inherit; border-radius: 0; min-width: 0; }
  input:focus { outline: none; border-bottom-color: var(--text); }
  .chip { cursor: pointer; user-select: none; color: var(--dim); margin-right: 12px; }
  .chip.on { color: var(--text); }
  .chip.on.WARNING { color: var(--warn); } .chip.on.ERROR { color: var(--bad); }
  main { padding: 8px 16px 40px; }
  .l { white-space: pre-wrap; overflow-wrap: anywhere; }
  .l .meta { color: var(--dim); }
  .l.DEBUG { color: var(--dim); } .l.WARNING { color: var(--warn); } .l.ERROR { color: var(--bad); }
  .note { color: var(--dim); padding: 4px 0; }
  a { color: var(--link); text-decoration: none; } a:hover { text-decoration: underline; }
</style>
</head>
<body>
<header>
  <div class="src" id="src"></div>
  <div class="bar"><span id="levels"></span><input id="q" type="search" placeholder="cerca…"><a href="#fine">↓ fine</a></div>
</header>
<main id="out"></main>
<div id="fine"></div>
<script src="log_data.js"></script>
<script src="viewer.js"></script>
</body>
</html>
